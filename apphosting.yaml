# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# NEXT_PUBLIC_* values must exist at BUILD time (Next.js inlines them into the
# client bundle) as well as at RUNTIME. They are public by design -- see
# .env.example. Anything genuinely secret belongs in Secret Manager, referenced
# here with `secret:` instead of `value:`.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyC4IuC-Azfn7XIOlo8Ph-9r-yO4Le2XNd8
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: photography-c16ff.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: photography-c16ff
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: photography-c16ff.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "157331071323"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:157331071323:web:4e28b33e1ce9cc48fdba7e
    availability:
      - BUILD
      - RUNTIME

  # Gates the admin UI only. The real enforcement is the matching UID hardcoded
  # in firestore.rules and storage.rules.
  - variable: NEXT_PUBLIC_ADMIN_UID
    value: OcjWZ7eZMkQf5tRdCFiBB7OvIoR2
    availability:
      - BUILD
      - RUNTIME

  # Resend API key for contact-form notification emails. Held in Secret
  # Manager, never in this file, and only needed by the server at runtime.
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME

  # A second Firebase project (no billing, Spark plan) used only for Gemini
  # calls. The main project must keep its billing account for App Hosting, and
  # Gemini's free tier requires a project with none -- so the model call lives
  # somewhere else. Public config, same as the block above.
  - variable: NEXT_PUBLIC_AI_FIREBASE_API_KEY
    value: AIzaSyBwH7Z34V7W6Lr_6RKbO0t1DEYv-BRAWjA
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_AI_FIREBASE_AUTH_DOMAIN
    value: homick-flicks-ai.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_AI_FIREBASE_PROJECT_ID
    value: homick-flicks-ai
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_AI_FIREBASE_APP_ID
    value: 1:803809882774:web:7c937b189cd6831e7648b7
    availability:
      - BUILD
      - RUNTIME

  # reCAPTCHA Enterprise site key for App Check on the AI project. A site key
  # is public by design -- it identifies the site to reCAPTCHA; the secret half
  # never leaves Google. Registered to homick-flicks-ai, so it only works for
  # that project.
  # Left unset on purpose. The key is valid and reCAPTCHA issues tokens for
  # this domain, but Firebase cannot exchange them -- CreateAssessment is
  # refused for the pairing of this key and this project, unresolved as of
  # 2026-09-23. With the variable set, App Check initializes, fails to get a
  # token, and takes the AI button down with it; unset, the code path is
  # skipped entirely and detection works as it did before. Put the value back
  # the moment the exchange succeeds.
  # - variable: NEXT_PUBLIC_AI_RECAPTCHA_SITE_KEY
  #   value: 6LfY4cktAAAAAF1radg-bovG4TgDC-qwF-4pbw_x
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # Sending address for both the contact notification and the photo-delivery
  # emails. Must be on a domain verified in Resend -- until then Resend only
  # delivers to the account owner's own address, which is no use for sending a
  # buyer their photos. Server-side only; there is nothing secret about it,
  # but the browser has no reason to see it either.
  #
  # no-reply because nobody reads replies to it: both emails set reply_to
  # separately, delivery to CONTACT_TO and the contact notification to
  # whoever filled the form in.
  - variable: CONTACT_FROM
    value: Homick Flicks <no-reply@homickflicks.com>
    availability:
      - RUNTIME

  - variable: DELIVERY_FROM
    value: Homick Flicks <no-reply@homickflicks.com>
    availability:
      - RUNTIME
